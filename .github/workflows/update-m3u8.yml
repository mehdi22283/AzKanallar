name: ATV Avrupa m3u8 yenile

on:
  schedule:
    # GitHub Actions cron-u hər 5 dəqiqədə bir işə salır.
    # Qeyd: GitHub bəzən yükdən asılı olaraq bunu tam dəqiq
    # 5 dəqiqə deyil, bir az gecikmə ilə çağıra bilər.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # istəsəniz "Run workflow" düyməsi ilə əl ilə də işə sala bilərsiniz

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-nu çıxart
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Statik metod üçün əlavə paket lazım deyil (yalnız standart kitabxana).
      # Əgər dinamik (Playwright) metodu da aktiv istəyirsinizsə, aşağıdakı
      # iki addımın commentini açın:
      #
      # - name: Playwright qur
      #   run: |
      #     pip install playwright
      #     playwright install --with-deps chromium

      - name: m3u8 linkini çək
        run: python fetch_m3u8.py

      - name: Dəyişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- atvavrupa.m3u8; then
            git add atvavrupa.m3u8
            git commit -m "atvavrupa.m3u8 yeniləndi: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "Dəyişiklik yoxdur, commit edilmədi."
          fi
