name: Update M3U8

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract videoSrc and create M3U8
        run: python generate_m3u8.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add euro-star.m3u8

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Euro Star M3U8"
            git push
          fi
